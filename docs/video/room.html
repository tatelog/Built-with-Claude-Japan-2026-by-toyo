<title>デモ動画 制作室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: プロジェクトハブと同じ製図板の作り。左に目次、右に1枚ずつ。上部に3分の尺を示すタイムコード帯 */
:root{
  --paper:#f2f4f3; --sheet:#fbfcfb; --ink:#17232e; --ink-2:#4a5a66; --rule:#cfd8d6; --grid:#e3e9e7;
  --accent:#1f5f8b; --check:#c8412a; --ok:#2f7a4f; --warn:#a86b00; --muted:#e7ecea;
  --side:#18242f; --side-fg:#d9e2e6; --side-dim:#8fa1ab; --side-hi:#2a3a47;
  --s1:#7d8b94; --s2:#5b7d96; --s3:#8a7a5c; --s4:#7a6a8c; --s5:#1f5f8b; --s6:#c8412a;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171d; --sheet:#141e25; --ink:#e3eaee; --ink-2:#9fb0ba; --rule:#2a3843; --grid:#1b2730;
  --accent:#6fb1de; --check:#f0765e; --ok:#6cc392; --warn:#e2a948; --muted:#1d2a33;
  --side:#0b1116; --side-fg:#d9e2e6; --side-dim:#7f929d; --side-hi:#1a2731;
  --s1:#8d9ba4; --s2:#7fa3bd; --s3:#b5a27c; --s4:#a594b8; --s5:#6fb1de; --s6:#f0765e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171d; --sheet:#141e25; --ink:#e3eaee; --ink-2:#9fb0ba; --rule:#2a3843; --grid:#1b2730;
  --accent:#6fb1de; --check:#f0765e; --ok:#6cc392; --warn:#e2a948; --muted:#1d2a33;
  --side:#0b1116; --side-fg:#d9e2e6; --side-dim:#7f929d; --side-hi:#1a2731;
  --s1:#8d9ba4; --s2:#7fa3bd; --s3:#b5a27c; --s4:#a594b8; --s5:#6fb1de; --s6:#f0765e; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:grid;gap:2px;padding:4px 8px 18px;border-bottom:1px solid var(--side-hi);margin-bottom:14px}
.brand b{font-weight:900;font-size:17px;line-height:1.35}
.brand span{font-size:11px;color:var(--side-dim);letter-spacing:.08em}
.side a.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:14px}
.side a.nav:hover{background:var(--side-hi)}
.side a.nav[aria-current="page"]{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.side a.nav .no{font-family:var(--f-mono);font-size:11px;color:var(--side-dim);width:30px;flex:none}
.side a.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-dim)}
.side .back{margin-top:18px;border-top:1px solid var(--side-hi);padding-top:14px}
.side .back a{color:var(--side-dim);font-size:13px;padding:4px 8px;display:block;text-decoration:none}
.side .back a:hover{color:var(--side-fg)}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,clamp(16px,4vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,4vw,48px))}
.topbar{display:none}
.sheet{max-width:1100px;margin:0 auto}
.titleblock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.titleblock h1{margin:0;font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.3;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--ink-2)}
.stamp{font-family:var(--f-mono);font-size:11.5px;border:1.5px solid currentColor;padding:2px 8px;border-radius:3px;white-space:nowrap;color:var(--warn)}
h2{font-weight:700;font-size:18px;margin:30px 0 10px;text-wrap:balance}
p,li{max-width:68ch}
.note{color:var(--ink-2);font-size:13.5px}
.status{font-size:12.5px;color:var(--ink-2);min-height:1.2em;margin:6px 0}
.status.err{color:var(--check)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--muted);white-space:nowrap;line-height:1.7}
.chip.ok{color:var(--ok);border-color:currentColor;background:transparent}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.chip.ng{color:var(--check);border-color:currentColor;background:transparent}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical;line-height:1.6}
label.f{display:grid;gap:2px;font-size:12px;color:var(--ink-2)}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:6px 14px}
button.ghost{background:transparent;color:var(--accent)}
button.danger{background:transparent;border-color:var(--check);color:var(--check)}
button.small{font-size:12px;padding:2px 9px}
button:disabled{opacity:.45;cursor:not-allowed}
.empty{border:1px dashed var(--rule);border-radius:8px;padding:18px;color:var(--ink-2);font-size:13.5px;background:var(--sheet)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* タイムコード帯（3:00） */
.tc{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px 8px}
.tc .bar{position:relative;height:30px;border-radius:4px;overflow:hidden;background:var(--muted)}
.tc .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;color:var(--sheet);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-decoration:none;border-right:1px solid var(--sheet)}
.tc .ticks{position:relative;height:16px;margin-top:3px}
#tl{cursor:pointer}
.tc .ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.tc .ticks span:first-child{transform:none}
.tc .ticks span:last-child{transform:translateX(-100%)}
.tc .marks{position:absolute;inset:0;pointer-events:none}
.tc .head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--check);pointer-events:none}

/* 絵コンテ */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.board{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.frame{aspect-ratio:16/9;max-width:100%;background:var(--muted);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;position:relative;display:grid;place-items:center;color:var(--ink-2);font-size:12.5px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .tcb{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--sheet);padding:1px 7px;border-radius:3px}
.board .body{padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.board h3{margin:0;font-size:16px;line-height:1.45}
.kv{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:3px 10px;font-size:13px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.edit{display:grid;gap:8px;border-top:1px dashed var(--rule);padding-top:10px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:baseline}

/* シナリオ */
.script{display:grid;gap:14px}
.sc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.sc .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.sc .hd b{font-size:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cols .c{min-width:0}
.cols .c h4{margin:0 0 4px;font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.04em}
.cols .c .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cols .c .tx.en{font-size:13.5px}
.cols .c .tx.blank{color:var(--ink-2);font-size:13px}
.meter{font-size:12px;color:var(--ink-2)}
.meter.over{color:var(--check);font-weight:700}

/* ビューワー */
.viewer{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.screen{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative}
.screen video{width:100%;height:100%;display:block;background:#000}
.screen .ph{color:#9aa8b1;font-size:13.5px;padding:16px;text-align:center}
.now{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:10px 0 6px}
.now .t{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.cutlist{display:grid;gap:6px}
.cut{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:7px 10px}
.cut[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cut b{font-size:14px}

@media (max-width:900px){
  .viewer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,290px);height:100%;z-index:30;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .titleblock{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div class="topbar">
  <button class="ghost small" id="menuBtn" aria-controls="side" aria-expanded="false">目次</button>
  <b>デモ動画 制作室</b>
</div>
<div class="app">
  <nav class="side" id="side" aria-label="ページ目次">
    <div class="brand"><b>デモ動画<br>制作室</b><span>3:00 ・ 日本語ナレーション ＋ 英語字幕</span></div>
    <div id="navList"></div>
    <div class="back"><a href="https://claude.ai/artifact/5trdhUPpa28QWrZo82CEiL" target="_blank" rel="noopener">← プロジェクトハブへ</a></div>
  </nav>
  <main><div class="sheet" id="view"></div></main>
</div>

<script>
(function(){
"use strict";
const HUB="https://claude.ai/artifact/5trdhUPpa28QWrZo82CEiL";
const TOTAL=180;
const PAGES=[
  {id:"top",no:"V-00",name:"概要"},
  {id:"storyboard",no:"V-01",name:"絵コンテ",cnt:"scenes"},
  {id:"scenario",no:"V-02",name:"シナリオ",cnt:"scenes"},
  {id:"viewer",no:"V-03",name:"ビューワーとコメント"}
];
const STATUS=["未着手","案","確定"];
const READ_CPS=5; // 日本語ナレーションの読み上げ目安：1秒あたり約5文字（1分300字）

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toSec=v=>{const m=String(v||"").trim().match(/^(\d+):(\d{1,2})(?:\.(\d))?$/); return m?(+m[1]*60+ +m[2]+(m[3]?+m[3]/10:0)):null;};
const fmt=s=>{s=Math.max(0,s||0); const m=Math.floor(s/60), r=s-m*60; return m+":"+(r<10?"0":"")+r.toFixed(1);};
const fmt0=s=>{s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const segColor=i=>`var(--s${Math.min(6,i+1)})`;
const jaLen=t=>String(t||"").replace(/\s/g,"").length;

const st={db:null,user:null,assets:null,ready:false,err:"",readOnly:false,scenes:[],cuts:[],me:null,cm:null,ca:null,caState:"",threads:[],cmode:false,
  editing:{}, cutId:null, localUrl:"", localName:"", cur:0, names:{}};

// ---------- 接続 ----------
function setErr(m){st.err=m; const el=$("#liveStatus"); if(el){el.className="status"+(m?" err":""); el.textContent=m||statusText();}}
function statusText(){ if(!st.db) return "共有データにつないでいます…"; if(!st.ready) return "読み込み中…"; return st.readOnly?"閲覧のみです。書き込みには編集権限が必要です。":""; }
async function write(fn,okMsg){
  if(!st.db||st.readOnly) return false;
  try{ await fn(); setErr(""); if(okMsg) flash(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"||c==="not_granted"){st.readOnly=true; setErr("この表示では書き込めません。閲覧のみになります。");}
    else if(c==="quota_exceeded"||c==="resource_exhausted"){setErr("保存できる量の上限です。不要なコメントを削除してください。");}
    else setErr("保存できませんでした。通信を確認して、もう一度お試しください。");
    render(); return false;
  }
}
function flash(m){const el=$("#liveStatus"); if(!el) return; el.className="status"; el.textContent=m; clearTimeout(flash.t); flash.t=setTimeout(()=>{ if(el.textContent===m) el.textContent=statusText(); },2500);}

function start(){
  if(!window.claude||!window.claude.use){ setErr("この表示では共有データを使えません。"); return; }
  window.claude.use("user").then(async u=>{ st.user=u; if(u){ try{st.me=await u.id();}catch(_){} } render(); });
  window.claude.use("assets").then(a=>{ st.assets=a; render(); });
  window.claude.use("comments").then(c=>{ st.cm=c; syncAnchoring(); render(); });
  window.claude.use("db").then(db=>{
    if(!db){ setErr("共有データを使えません（サインインが必要です）。"); render(); return; }
    st.db=db; render();
    const timer=setTimeout(()=>{ if(!st.ready) setErr("共有データにまだ届きません。通信を確認してください。"); },10000);
    let n=0; const got=()=>{ if(++n>=2){ clearTimeout(timer); st.ready=true; if(st.err.startsWith("共有データにまだ")) st.err=""; } };
    const sub=(name,order,key)=>{ let first=true;
      db.collection(name).orderBy(order,"asc").onSnapshot(s=>{
        st[key]=s.docs.map(d=>({id:d.id,...d.data()}));
        if(first&&!s.metadata.fromCache){first=false; got();}
        if(key==="cuts"&&!st.cutId&&st.cuts.length) st.cutId=st.cuts[st.cuts.length-1].id;
        render();
      },e=>{ clearTimeout(timer); setErr("読み込めませんでした（"+e.code+"）"); render(); });
    };
    sub("scenes","order","scenes"); sub("cuts","createdAt","cuts");
  }).catch(()=>{ setErr("共有データを使えません。"); render(); });
}

// ---------- 共通部品 ----------
function sceneAt(t){ return st.scenes.find(s=>{const a=toSec(s.tcIn),b=toSec(s.tcOut); return a!=null&&b!=null&&t>=a&&t<b;}); }
function tcStrip(opts={}){
  const segs=st.scenes.map((s,i)=>{const a=toSec(s.tcIn),b=toSec(s.tcOut); if(a==null||b==null) return "";
    const href=opts.link?` href="#${opts.link}" data-scene="${esc(s.id)}"`:"";
    return `<a class="seg"${href} style="left:${a/TOTAL*100}%;width:${(b-a)/TOTAL*100}%;background:${segColor(i)}" title="${esc(s.tcIn)}–${esc(s.tcOut)} ${esc(s.era||"")}">${esc(s.era||s.title||"")}</a>`;}).join("");
  const ticks=[0,30,60,90,120,150,180].map(t=>`<span style="left:${t/TOTAL*100}%">${fmt0(t)}</span>`).join("");
  const marks=opts.timeline?`<div class="marks"><span class="head" id="playhead" style="left:${Math.min(100,st.cur/TOTAL*100)}%"></span></div>`:"";
  return `<div class="tc"><div class="bar"${opts.timeline?' id="tl"':""}>${segs||""}${marks}</div><div class="ticks">${ticks}</div></div>`;
}
function head(p,stamp){
  return `<div class="titleblock"><div><div class="eyebrow">${p.no} ・ デモ動画</div><h1>${esc(p.name)}</h1></div>${stamp?`<span class="stamp">${esc(stamp)}</span>`:""}</div><div id="liveStatus" class="status"></div>`;
}
const canWrite=()=>!!st.db&&!st.readOnly;
const dis=()=>canWrite()?"":" disabled";
function loadingOr(emptyHtml){ if(!st.ready&&!st.err) return `<div class="empty">読み込み中…</div>`; return emptyHtml; }

// ---------- V-00 概要 ----------
function pageTop(){
  const done=st.scenes.filter(s=>s.status==="確定").length;
  return `<p>提出物の3分デモ動画を作るための部屋です。筋書きは「設計は一周して、手に還る」。手書きから始まった設計が、デジタイザ・マウス・タブレットを経て、Apple Pencil で再び手に戻るまでを6場面で見せます。</p>
  ${tcStrip({link:"storyboard"})}
  <div class="grid2" style="margin-top:16px">
    <a class="panel" href="#storyboard" style="text-decoration:none;color:inherit"><div class="eyebrow">V-01</div><b>絵コンテ</b><div class="note">場面ごとの映像・尺・素材。コマ画像を貼れます。</div><div class="row" style="margin-top:6px"><span class="chip">${st.scenes.length} 場面</span><span class="chip ok">確定 ${done}</span></div></a>
    <a class="panel" href="#scenario" style="text-decoration:none;color:inherit"><div class="eyebrow">V-02</div><b>シナリオ</b><div class="note">ナレーション原稿・英語字幕・画面の文字。読み上げ秒数を尺と比べます。</div></a>
    <a class="panel" href="#viewer" style="text-decoration:none;color:inherit"><div class="eyebrow">V-03</div><b>ビューワーとコメント</b><div class="note">編集中の動画を見ながら、再生位置にコメントを付けます。</div><div class="row" style="margin-top:6px"><span class="chip">版 ${st.cuts.length}</span></div></a>
  </div>
  <h2>決まっていること</h2>
  <ul>
    <li>尺は3分以内。日本語ナレーション＋英語字幕</li>
    <li>提出は 11/10（火）14:00 JST まで。作品の場面（0:55〜2:30）と待ち時間の実測（2:30〜）は完成後にしか撮れない</li>
    <li>権利がはっきりしない素材は使わない。東京タワーの設計図・建設当時の写真は、早稲田大学歴史館・内藤多仲記念館の許諾が出るまで使わない</li>
    <li>実案件のデータ・自社単価・施主情報は映さない。自社の図面は施主名・所在地をぼかす</li>
  </ul>
  <p class="note">企画・工程・タスクは <a href="${HUB}" target="_blank" rel="noopener">プロジェクトハブ</a> にあります。</p>`;
}

// ---------- V-01 絵コンテ ----------
function boardCard(s,i){
  const ed=st.editing["b:"+s.id];
  const a=toSec(s.tcIn),b=toSec(s.tcOut); const len=(a!=null&&b!=null)?(b-a):null;
  const img=s.frame?`<img src="/_blob/${esc(s.frame)}" alt="${esc(s.title||"")} のコマ" loading="lazy">`:`<span>コマ未作成</span>`;

    <div class="body"><div class="row"><span class="sw" style="background:${segColor(i)}"></span><span class="eyebrow">場面 ${i+1} ・ ${esc(s.era||"")}</span><span class="chip ${stc}" style="margin-left:auto">${esc(s.status||"未着手")}</span></div>

      <label class="f">見出し<input id="b-ti-${esc(s.id)}" name="title" value="${esc(s.title||"")}"></label>
      <label class="f">映像<textarea id="b-pi-${esc(s.id)}" name="picture">${esc(s.picture||"")}</textarea></label>
      <label class="f">画面の文字<textarea id="b-on-${esc(s.id)}" name="onscreen">${esc(s.onscreen||"")}</textarea></label>
      <label class="f">素材<textarea id="b-ma-${esc(s.id)}" name="materials">${esc(s.materials||"")}</textarea></label>
      <label class="f">撮り方（カメラ位置・尺）<textarea id="b-sh-${esc(s.id)}" name="shot">${esc(s.shot||"")}</textarea></label>
      ${st.assets?`<label class="f">コマ画像（PNG・JPEG、20MB まで）<input id="b-fr-${esc(s.id)}" type="file" accept="image/png,image/jpeg,image/webp" data-frame="${esc(s.id)}"></label>`:`<div class="note">コマ画像を貼れるのは編集権限のある人だけです。</div>`}
      <div class="row"><button type="submit">保存</button><button type="button" class="ghost" data-act="cancel" data-key="b:${esc(s.id)}">閉じる</button></div></form>`;
  } else {

}
function pageStoryboard(){

}

// ---------- V-02 シナリオ ----------
function scCard(s,i){

      <label class="f c">英語字幕<textarea id="s-en-${esc(s.id)}" name="subtitleEn" rows="5">${esc(s.subtitleEn||"")}</textarea></label>

      <div class="row"><button type="submit">保存</button><button type="button" class="ghost" data-act="cancel" data-key="s:${esc(s.id)}">閉じる</button></div></form>`;

function pageScenario(){
  const tot=st.scenes.reduce((a,s)=>a+jaLen(s.narrationJa),0);

    <div class="row" style="margin-bottom:12px"><span class="chip">ナレーション合計 ${tot}字</span><span class="chip">読み上げ約${fmt0(tot/READ_CPS)}</span><span class="chip">上限 3:00</span></div>`;
  if(!st.scenes.length) return h+loadingOr(`<div class="empty">場面がまだありません。絵コンテと同じ6場面がここに並びます。</div>`);
  return h+`<div class="script">${st.scenes.map(scCard).join("")}</div>`;
}

// ---------- V-03 ビューワー ----------
function curCut(){ return st.cuts.find(c=>c.id===st.cutId)||null; }
function curKey(){ if(st.localUrl) return "local"; const c=curCut(); return c?c.id:""; }
function curLabel(){ if(st.localUrl) return "この端末の動画"; const c=curCut(); return c?(c.label||"版"):""; }
// コメントの位置（アンカー）＝「版 @ 秒」。例 cut:abc123@83.4
const anchorOf=(key,t)=>`cut:${key}@${(Math.round(t*10)/10).toFixed(1)}`;
function parseAnchor(a){ const m=String(a||"").match(/^cut:([A-Za-z0-9_-]+)@(\d+(?:\.\d)?)$/); return m?{key:m[1],t:+m[2]}:null; }
function pageViewer(){
  const cut=curCut();
  const src=st.localUrl||(cut&&cut.asset?"/_blob/"+cut.asset:"");
  const sc=sceneAt(st.cur);
  const screen=src?`<video id="vid" src="${esc(src)}" controls playsinline preload="metadata"></video>`:
    `<div class="ph">動画がまだありません。<br>右の「版を追加」で書き出した動画を上げるか、「この端末の動画で見る」を使ってください。</div>`;
  const label=st.localUrl?`この端末の動画：${esc(st.localName)}`:(cut?`${esc(cut.label||"")}`:"");
  const mine=st.threads.map(x=>({x,p:parseAnchor(x.anchor)})).filter(o=>o.p&&o.p.key===curKey());
  const canC=!!st.cm&&st.caState!=="off";
  let h=`<p class="note">動画を止めて「この位置にコメント」を押すと、その時刻にコメントが付きます。コメントの印はタイムライン上に出ます。印を開くとその時刻へ飛びます。</p>
  <div class="viewer"><div style="min-width:0">
    <div class="screen">${screen}</div>
    <div class="now"><span class="t" id="nowT">${fmt(st.cur)}</span><span class="chip" id="nowScene">${esc(sc?sc.era+"・"+(sc.title||""):"場面外")}</span><span class="note">${label}</span></div>
    ${tcStrip({timeline:true})}
    <div class="row" style="margin-top:12px">
      <button type="button" id="commentHere"${(!src||!canC)?" disabled":""}>この位置にコメント</button>
      <span class="note" id="cmNote">${!src?"先に動画を開いてください。":!st.cm?"この表示ではコメントを書けません（サインインと閲覧以上の権限が必要です）。":st.caState==="off"?"右上のコメントボタンから書き込めます。時刻も書き添えてください。":st.cmode?"コメントモード中：タイムラインを押すと、その時刻にコメントできます。":`この版のコメント ${mine.length}件${mine.length?`（未解決 ${mine.filter(o=>!o.x.resolved).length}）`:""}`}</span>
    </div>
  </div>
  <div style="min-width:0;display:grid;gap:14px">
    <div><h2 style="margin-top:0">版</h2>
      ${st.cuts.length?`<div class="cutlist">${st.cuts.slice().reverse().map(c=>
        `<div class="cut" aria-current="${!st.localUrl&&c.id===st.cutId}"><div><b>${esc(c.label||"")}</b><div class="note">${c.createdAt?esc(new Date(c.createdAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})):""}${c.memo?" ・ "+esc(c.memo):""}</div></div><button type="button" class="ghost small" data-cut="${esc(c.id)}">開く</button></div>`).join("")}</div>`
        :loadingOr(`<div class="empty">まだ版がありません。</div>`)}
      ${st.assets?`<form id="cutForm" class="panel" style="margin-top:10px;display:grid;gap:8px" autocomplete="off">
        <b style="font-size:14px">版を追加</b>
        <label class="f">名前<input id="cutLabel" name="label" maxlength="60" placeholder="例：第1版 歴史パートのみ" required></label>
        <label class="f">メモ<input id="cutMemo" name="memo" maxlength="120" placeholder="例：仮ナレーション"></label>
        <label class="f">動画（MP4・WebM、20MB まで）<input id="cutFile" name="file" type="file" accept="video/mp4,video/webm" required></label>
        <div class="note">20MB に収めるには 720p で書き出してください。3分なら目安は 720p・映像 0.8Mbps 程度です。</div>
        <button type="submit">上げる</button></form>`:`<div class="note" style="margin-top:8px">動画を上げられるのは編集権限のある人だけです。</div>`}
      <div class="panel" style="margin-top:10px;display:grid;gap:6px">
        <b style="font-size:14px">この端末の動画で見る</b>
        <div class="note">20MB を超える版は、手元のファイルをこの画面で開いて見られます。動画は送信されません。コメントは「この端末の動画」の印としてまとめて残ります。</div>
        <input id="localFile" type="file" accept="video/*" aria-label="この端末の動画を選ぶ">
      </div>
    </div>
  </div></div>`;
  return h;
}

// ---------- コメント（claude.ai のコメント機能。印の位置だけこのページが決める） ----------
function tlPoint(t){
  const bar=$("#tl"); if(!bar) return null; const r=bar.getBoundingClientRect(); if(!r.width) return null;
  return {x:r.left+window.scrollX+Math.min(1,Math.max(0,t/TOTAL))*r.width, y:r.top+window.scrollY+r.height/2};
}
function reportPlaced(){
  if(!st.ca) return; const map={}; const key=curKey();
  st.threads.forEach(x=>{ const p=parseAnchor(x.anchor); if(p&&p.key===key){ const pt=tlPoint(p.t); if(pt) map[x.id]=pt; } });
  try{ st.ca.placed(map); }catch(_){}
}
async function syncAnchoring(){
  const want=curPage==="viewer"&&!!st.cm;
  if(want&&!st.ca&&st.caState!=="off"&&st.caState!=="pending"){
    st.caState="pending";
    try{
      st.ca=await st.cm.customAnchors({
        mode:on=>{ st.cmode=on; if(!on) st.threads=[]; refreshNote(); },
        threads:list=>{ st.threads=list||[]; reportPlaced(); refreshNote(); },
        reveal:id=>{ const x=st.threads.find(y=>y.id===id); const p=x&&parseAnchor(x.anchor); if(!p) return;
          if(p.key!==curKey()){ if(p.key==="local"){ flash("このコメントは「この端末の動画」に付いています。同じ動画を開いてください。"); return; } st.cutId=p.key; if(st.localUrl){URL.revokeObjectURL(st.localUrl); st.localUrl="";} render.force=true; render(); }
          seek(p.t); const bar=$("#tl"); if(bar) bar.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
      });
      st.caState="on"; if(curPage!=="viewer"){ st.ca.release(); st.ca=null; st.caState=""; } else reportPlaced();
    }catch(e){ st.ca=null; st.caState="off"; }
    refreshNote();
  } else if(!want&&st.ca){ try{ st.ca.release(); }catch(_){} st.ca=null; st.caState=""; st.threads=[]; st.cmode=false; }
}
function refreshNote(){ if(curPage!=="viewer"||!$("#view .viewer")) return; updateViewerSide(); }
async function composeAt(t){
  const key=curKey(); if(!key) return;
  const sc=sceneAt(t); const lbl=`${curLabel()} ${fmt(t)}${sc?" "+sc.era:""}`;
  const v=$("#vid"); if(v) v.pause();
  if(st.ca){
    const pt=tlPoint(t)||$("#tl");
    try{ await st.ca.compose(anchorOf(key,t),pt,{label:lbl}); }catch(e){ if(e&&e.code==="rate_limited") flash("少し待ってからもう一度押してください。"); }
  } else if(st.cm){
    try{ await st.cm.openComposer({element:$("#tl")||$("#view")}); flash(`時刻 ${fmt(t)} を書き添えてください。`); }catch(_){ flash("この表示ではコメントを書けません。"); }
  }
}
function bindVideo(){
  const v=$("#vid"); if(!v) return;
  if(st.cur>0){ v.addEventListener("loadedmetadata",()=>{ try{ v.currentTime=Math.min(st.cur,v.duration||st.cur); }catch(_){} },{once:true}); }
  v.addEventListener("timeupdate",()=>{ st.cur=v.currentTime;
    const t=fmt(st.cur); const a=$("#nowT"); if(a) a.textContent=t;
    const sc=sceneAt(st.cur); const c=$("#nowScene"); if(c) c.textContent=sc?sc.era+"・"+(sc.title||""):"場面外";
    const ph=$("#playhead"); if(ph) ph.style.left=Math.min(100,st.cur/TOTAL*100)+"%"; });
}
function seek(t){ const v=$("#vid"); st.cur=+t; if(v){ try{ v.currentTime=+t; v.pause(); }catch(_){} } const a=$("#nowT"); if(a) a.textContent=fmt(st.cur); const ph=$("#playhead"); if(ph) ph.style.left=Math.min(100,st.cur/TOTAL*100)+"%"; }

// ---------- 描画 ----------
let curPage="top";
function renderNav(){
  const c={scenes:st.scenes.length};
  $("#navList").innerHTML=PAGES.map(p=>`<a class="nav" href="#${p.id}"${p.id===curPage?' aria-current="page"':""}><span class="no">${p.no}</span>${esc(p.name)}${p.cnt&&st.ready?`<span class="cnt">${c[p.cnt]}</span>`:""}</a>`).join("");
}
function render(){
  const p=PAGES.find(x=>x.id===curPage)||PAGES[0];
  renderNav();
  // 入力中の欄を守る：編集フォームやコメント欄にフォーカスがある間は本文を描き直さない
  const ae=document.activeElement;
  if(ae&&$("#view").contains(ae)&&(ae.tagName==="TEXTAREA"||(ae.tagName==="INPUT"&&ae.type!=="file"))){ deferred=true; const s=$("#liveStatus"); if(s&&!st.err) s.textContent=statusText(); return; }
  if(p.id==="viewer"&&$("#vid")&&!render.force){ // 再生中の動画を止めないよう、動画以外だけ更新
    const v=$("#vid"); const cut=curCut(); const want=st.localUrl||(cut&&cut.asset?"/_blob/"+cut.asset:"");
    if(v.getAttribute("src")===want){ updateViewerSide(); return; }
  }
  render.force=false;
  let body="";
  if(p.id==="top") body=pageTop(); else if(p.id==="storyboard") body=pageStoryboard(); else if(p.id==="scenario") body=pageScenario(); else body=pageViewer();
  $("#view").innerHTML=head(p, p.id==="top"?"準備中":"")+body;
  setErr(st.err);
  if(p.id==="viewer"){ bindVideo(); }
  syncAnchoring(); if(p.id==="viewer") requestAnimationFrame(reportPlaced);
}
let deferred=false;
function updateViewerSide(){
  const tmp=document.createElement("div"); tmp.innerHTML=pageViewer();
  const right=$("#view .viewer > div:last-child"), nr=tmp.querySelector(".viewer > div:last-child");
  if(right&&nr) right.replaceWith(nr);
  const tc=$("#view .viewer .tc"), ntc=tmp.querySelector(".viewer .tc"); if(tc&&ntc) tc.replaceWith(ntc);
  ["#cmNote","#commentHere"].forEach(sel=>{ const a=$(sel), b=tmp.querySelector(sel); if(a&&b) a.replaceWith(b); });
  setErr(st.err); reportPlaced();
}
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(deferred){ const ae=document.activeElement; if(!(ae&&$("#view").contains(ae)&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))){ deferred=false; render(); } } },0); });

function route(){ const h=(location.hash||"").slice(1); curPage=PAGES.some(p=>p.id===h)?h:"top"; render.force=true; deferred=false; render(); window.scrollTo(0,0); $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
window.addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",()=>{const o=$("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded",String(o));});

// ---------- 操作 ----------
window.addEventListener("resize",()=>{ if(curPage==="viewer") reportPlaced(); });
document.addEventListener("click",e=>{ // コメントモード中はタイムラインを押した時刻にコメント。通常時はその時刻へ移動
  const bar=e.target.closest&&e.target.closest("#tl"); if(!bar) return;
  e.preventDefault(); e.stopPropagation();
  const r=bar.getBoundingClientRect(); const t=Math.max(0,Math.min(TOTAL,(e.clientX-r.left)/r.width*TOTAL));
  if(st.cmode&&st.ca&&curKey()) composeAt(t); else seek(t);
},true);
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  if(t.dataset.seek!=null){ seek(t.dataset.seek); return; }
  if(t.dataset.scene&&t.tagName==="A"){ e.preventDefault(); const id=t.dataset.scene; location.hash="storyboard"; setTimeout(()=>{const el=document.getElementById("sc-"+id); if(el) el.scrollIntoView({block:"start"});},0); return; }
  if(t.id==="commentHere"){ composeAt(st.cur); return; }
  if(t.dataset.cut){ st.cutId=t.dataset.cut; if(st.localUrl){ URL.revokeObjectURL(st.localUrl); st.localUrl=""; } st.cur=0; render.force=true; render(); return; }
  const act=t.dataset.act; if(!act) return;
  if(act==="edit"){ st.editing[t.dataset.key]=true; render.force=true; deferred=false; document.activeElement&&document.activeElement.blur(); render(); return; }
  if(act==="cancel"){ delete st.editing[t.dataset.key]; deferred=false; document.activeElement&&document.activeElement.blur(); render.force=true; render(); return; }
});
document.addEventListener("submit",async e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.form==="board"||f.dataset.form==="script"){
    const id=f.dataset.id; const fd=new FormData(f); const patch={};
    for(const [k,v] of fd.entries()){ if(typeof v==="string") patch[k]=v.trim(); }
    if("tcIn" in patch&&patch.tcIn&&toSec(patch.tcIn)==null){ setErr("開始は 0:20 のように「分:秒」で入れてください。"); return; }
    if("tcOut" in patch&&patch.tcOut&&toSec(patch.tcOut)==null){ setErr("終了は 0:35 のように「分:秒」で入れてください。"); return; }
    patch.updatedAt=new Date().toISOString(); if(st.me) patch.updatedBy=st.me;
    const ok=await write(()=>st.db.collection("scenes").doc(id).update(patch),"保存しました");
    if(ok){ delete st.editing[(f.dataset.form==="board"?"b:":"s:")+id]; deferred=false; document.activeElement&&document.activeElement.blur(); render.force=true; render(); flash("保存しました"); }
    return;
  }
  if(f.id==="cutForm"){
    const file=$("#cutFile").files[0]; const label=$("#cutLabel").value.trim(); if(!file||!label) return;
    if(file.size>20*1024*1024){ setErr("20MB を超えています。720p で書き出し直すか、「この端末の動画で見る」を使ってください。"); return; }
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="上げています…";
    try{
      const r=await st.assets.upload(file,{type:file.type==="video/webm"?"video/webm":"video/mp4"});
      const ok=await write(()=>st.db.collection("cuts").add({label,memo:$("#cutMemo").value.trim(),asset:r.id,createdAt:new Date().toISOString(),by:st.me||""}));
      if(ok){ $("#cutLabel").value=""; $("#cutMemo").value=""; $("#cutFile").value=""; st.cutId=null; flash("版を追加しました"); }
    }catch(err){ const c=err&&err.code;
      setErr(c==="too_large"?"20MB を超えています。720p で書き出し直してください。":c==="unsupported_type"?"MP4 か WebM の動画を選んでください。":c==="quota_or_state"?"保存容量の上限です。古い版を整理してください。":"動画を上げられませんでした。もう一度お試しください。"); }
    btn.disabled=false; btn.textContent="上げる";
    render.force=true; deferred=false; document.activeElement&&document.activeElement.blur(); render();
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="localFile"&&t.files[0]){ if(st.localUrl) URL.revokeObjectURL(st.localUrl); st.localUrl=URL.createObjectURL(t.files[0]); st.localName=t.files[0].name; st.cur=0; render.force=true; deferred=false; t.blur(); render(); return; }
  if(t.dataset.frame&&t.files[0]&&st.assets){
    const id=t.dataset.frame; const file=t.files[0];
    try{ const r=await st.assets.upload(file,{type:/^image\/(png|jpeg|webp)$/.test(file.type)?file.type:"image/png"});
      await write(()=>st.db.collection("scenes").doc(id).update({frame:r.id}),"コマ画像を貼りました"); }
    catch(err){ setErr(err&&err.code==="too_large"?"画像が大きすぎます（20MB まで）。":"画像を上げられませんでした。PNG か JPEG を選んでください。"); }
  }
});

route();
start();
})();
</script>
