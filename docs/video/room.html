<title>デモ動画 制作室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: プロジェクトハブと同じ製図板の作り。左に目次、右に1枚ずつ。上部に3分の尺を示すタイムコード帯 */
:root{
  --paper:#f2f4f3; --sheet:#fbfcfb; --ink:#17232e; --ink-2:#4a5a66; --rule:#cfd8d6; --grid:#e3e9e7;
  --accent:#1f5f8b; --check:#c8412a; --ok:#2f7a4f; --warn:#a86b00; --muted:#e7ecea;
  --side:#18242f; --side-fg:#d9e2e6; --side-dim:#8fa1ab; --side-hi:#2a3a47;
  --s1:#7d8b94; --s2:#5b7d96; --s3:#8a7a5c; --s4:#7a6a8c; --s5:#1f5f8b; --s6:#c8412a;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f171d; --sheet:#141e25; --ink:#e3eaee; --ink-2:#9fb0ba; --rule:#2a3843; --grid:#1b2730;
  --accent:#6fb1de; --check:#f0765e; --ok:#6cc392; --warn:#e2a948; --muted:#1d2a33;
  --side:#0b1116; --side-fg:#d9e2e6; --side-dim:#7f929d; --side-hi:#1a2731;
  --s1:#8d9ba4; --s2:#7fa3bd; --s3:#b5a27c; --s4:#a594b8; --s5:#6fb1de; --s6:#f0765e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f171d; --sheet:#141e25; --ink:#e3eaee; --ink-2:#9fb0ba; --rule:#2a3843; --grid:#1b2730;
  --accent:#6fb1de; --check:#f0765e; --ok:#6cc392; --warn:#e2a948; --muted:#1d2a33;
  --side:#0b1116; --side-fg:#d9e2e6; --side-dim:#7f929d; --side-hi:#1a2731;
  --s1:#8d9ba4; --s2:#7fa3bd; --s3:#b5a27c; --s4:#a594b8; --s5:#6fb1de; --s6:#f0765e; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
*{box-sizing:border-box}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;overflow-y:auto;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{display:grid;gap:2px;padding:4px 8px 18px;border-bottom:1px solid var(--side-hi);margin-bottom:14px}
.brand b{font-weight:900;font-size:17px;line-height:1.35}
.brand span{font-size:11px;color:var(--side-dim);letter-spacing:.08em}
.side a.nav{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;color:var(--side-fg);text-decoration:none;font-size:14px}
.side a.nav:hover{background:var(--side-hi)}
.side a.nav[aria-current="page"]{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.side a.nav .no{font-family:var(--f-mono);font-size:11px;color:var(--side-dim);width:30px;flex:none}
.side a.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--side-dim)}
.side .back{margin-top:18px;border-top:1px solid var(--side-hi);padding-top:14px}
.side .back a{color:var(--side-dim);font-size:13px;padding:4px 8px;display:block;text-decoration:none}
.side .back a:hover{color:var(--side-fg)}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,clamp(16px,4vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),clamp(16px,4vw,48px))}
.topbar{display:none}
.sheet{max-width:1100px;margin:0 auto}
.titleblock{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.titleblock h1{margin:0;font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.3;text-wrap:balance}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;color:var(--ink-2)}
.stamp{font-family:var(--f-mono);font-size:11.5px;border:1.5px solid currentColor;padding:2px 8px;border-radius:3px;white-space:nowrap;color:var(--warn)}
h2{font-weight:700;font-size:18px;margin:30px 0 10px;text-wrap:balance}
p,li{max-width:68ch}
.note{color:var(--ink-2);font-size:13.5px}
.status{font-size:12.5px;color:var(--ink-2);min-height:1.2em;margin:6px 0}
.status.err{color:var(--check)}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--rule);background:var(--muted);white-space:nowrap;line-height:1.7}
.chip.ok{color:var(--ok);border-color:currentColor;background:transparent}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.chip.ng{color:var(--check);border-color:currentColor;background:transparent}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
textarea{min-height:64px;resize:vertical;line-height:1.6}
label.f{display:grid;gap:2px;font-size:12px;color:var(--ink-2)}
button{font:inherit;font-size:13.5px;cursor:pointer;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:6px 14px}
button.ghost{background:transparent;color:var(--accent)}
button.danger{background:transparent;border-color:var(--check);color:var(--check)}
button.small{font-size:12px;padding:2px 9px}
button:disabled{opacity:.45;cursor:not-allowed}
.empty{border:1px dashed var(--rule);border-radius:8px;padding:18px;color:var(--ink-2);font-size:13.5px;background:var(--sheet)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* タイムコード帯（3:00） */
.tc{border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:10px 12px 8px}
.tc .bar{position:relative;height:30px;border-radius:4px;overflow:hidden;background:var(--muted)}
.tc .seg{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 6px;color:var(--sheet);font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-decoration:none;border-right:1px solid var(--sheet)}
.tc .ticks{position:relative;height:16px;margin-top:3px}
#tl{cursor:pointer}
.tc .ticks span{position:absolute;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.tc .ticks span:first-child{transform:none}
.tc .ticks span:last-child{transform:translateX(-100%)}
.tc .marks{position:absolute;inset:0;pointer-events:none}
.tc .head{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--check);pointer-events:none}

/* 絵コンテ */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.board{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.frame{aspect-ratio:16/9;max-width:100%;background:var(--muted);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;position:relative;display:grid;place-items:center;color:var(--ink-2);font-size:12.5px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame .tcb{position:absolute;left:8px;top:8px;font-family:var(--f-mono);font-size:11px;background:var(--ink);color:var(--sheet);padding:1px 7px;border-radius:3px}
.board .body{padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.board h3{margin:0;font-size:16px;line-height:1.45}
.kv{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:3px 10px;font-size:13px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.edit{display:grid;gap:8px;border-top:1px dashed var(--rule);padding-top:10px}
.sb{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.sbDetail .board{grid-template-rows:auto 1fr}
.sbList{display:grid;gap:6px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
.sbRow{display:grid;grid-template-columns:10px auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:6px;padding:8px 10px}
.sbRow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.sbRow .sbTc{font-size:12px;color:var(--ink-2)}
.sbRow .sbTitle{display:grid;min-width:0}
.sbRow .sbTitle b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbRow .sbTitle .note{font-size:11.5px}
@media (max-width:900px){.sb{grid-template-columns:minmax(0,1fr)}.sbList{order:-1;position:static;max-height:none}}
.ed{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.edStage{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.edStage canvas{width:100%;height:100%;display:block}
.edTL{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px}
.edTrack{position:relative;height:96px}
.edTicks{position:absolute;left:0;right:0;top:0;height:16px}
.edTicks span{position:absolute;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2)}
.edClip{position:absolute;top:20px;height:70px;padding:0;border:1px solid var(--rule);border-radius:4px;background:var(--muted);color:var(--ink);overflow:hidden;display:block;text-align:left}
.edClip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85}
.edClip span{position:absolute;left:4px;right:4px;bottom:3px;font-size:10.5px;line-height:1.3;color:#fff;text-shadow:0 1px 2px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edClip.sel{outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
.edPH{position:absolute;top:16px;bottom:0;width:2px;background:var(--check);pointer-events:none}
.edLib{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;max-height:340px;overflow-y:auto}
.edThumb{padding:0;border:1px solid var(--rule);background:var(--muted);border-radius:4px;overflow:hidden;display:grid;color:var(--ink);text-align:left}
.edThumb img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.edThumb span{font-size:10.5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}}
.tlWrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);margin-top:8px;-webkit-overflow-scrolling:touch}
.tlInner{position:relative;padding-bottom:6px}
.tlRow{display:flex;border-bottom:1px solid var(--rule)}
.tlRow:last-of-type{border-bottom:0}
.tlLbl{position:sticky;left:0;z-index:4;flex:0 0 96px;width:96px;background:var(--muted);border-right:1px solid var(--rule);padding:6px 8px;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:4px}
.tlLane{position:relative;height:56px;flex:none}
.tlRow[data-track="video"] .tlLane{height:76px}
.tlRow[data-track="text"] .tlLane{height:34px}
.tlRulerRow .tlLane{height:26px;cursor:pointer;touch-action:none}
.tlRuler span{position:absolute;top:5px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);padding-left:3px;border-left:1px solid var(--rule)}
.tlBar{position:absolute;top:6px;bottom:6px;border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.25);background:#5b6b78;color:#fff;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.tlBar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;pointer-events:none}
.tlBar.txt{background:#111}
.tlBar.t{background:#2b2f36;cursor:pointer}
.tlBar.a.narr{background:#2f6d5a}.tlBar.a.bgm{background:#5a4f8a}.tlBar.a.sfx{background:#8a5a2f}
.tlBar.sel{outline:3px solid var(--accent);outline-offset:-1px;z-index:3}
.tlT{position:absolute;left:12px;right:12px;bottom:4px;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000;pointer-events:none}
.tlVol{position:absolute;right:12px;bottom:0;width:3px;background:rgba(255,255,255,.6);pointer-events:none}
.tlH{position:absolute;top:0;bottom:0;width:12px;z-index:2;cursor:ew-resize;background:rgba(255,255,255,.18)}
.tlH.l{left:0}.tlH.r{right:0}
.tlBar.t .tlH{display:none}
.tlPH{position:absolute;top:0;bottom:0;width:2px;background:var(--check);pointer-events:none;z-index:6}
.tlAdd{cursor:pointer;color:var(--accent);font-size:16px;line-height:1;padding:2px 6px;border:1px solid var(--accent);border-radius:4px}
.tlEmpty{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-2);white-space:nowrap}
.edLogList{margin:0;padding-left:1.4em;font-size:13px;display:grid;gap:2px;max-height:220px;overflow-y:auto}
#agentBox summary{cursor:pointer}
.chipbtn{cursor:pointer;font:inherit;font-size:12px;padding:2px 10px}
.chipbtn[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:1px;font-weight:700}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:8px}
.gi{margin:0;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;min-width:0}
.gi img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--muted)}
.gi figcaption{padding:8px 10px;display:grid;gap:3px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:baseline}

/* シナリオ */
.script{display:grid;gap:14px}
.sc{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.sc .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline}
.sc .hd b{font-size:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.cols .c{min-width:0}
.cols .c h4{margin:0 0 4px;font-size:12px;color:var(--ink-2);font-weight:500;letter-spacing:.04em}
.cols .c .tx{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.cols .c .tx.en{font-size:13.5px}
.cols .c .tx.blank{color:var(--ink-2);font-size:13px}
.meter{font-size:12px;color:var(--ink-2)}
.meter.over{color:var(--check);font-weight:700}

/* ビューワー */
.viewer{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
.screen{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;position:relative}
.screen video{width:100%;height:100%;display:block;background:#000}
.screen .ph{color:#9aa8b1;font-size:13.5px;padding:16px;text-align:center}
.now{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;margin:10px 0 6px}
.now .t{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums}
.cutlist{display:grid;gap:6px}
.cut{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:7px 10px}
.cut[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.cut b{font-size:14px}

@media (max-width:900px){
  .viewer{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,290px);height:100%;z-index:30;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--rule);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--paper)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:16px}
  .titleblock{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

    <div class="brand"><b>デモ動画<br>制作室</b><span>3:00 ・ 日本語ナレーション ＋ 英語字幕</span></div>
    <div id="navList"></div>
    <div class="back"><a href="https://claude.ai/artifact/5trdhUPpa28QWrZo82CEiL" target="_blank" rel="noopener">← プロジェクトハブへ</a></div>

<script>
(function(){
"use strict";
const HUB="https://claude.ai/artifact/5trdhUPpa28QWrZo82CEiL";
const TOTAL=180;
const PAGES=[
  {id:"top",no:"V-00",name:"概要"},
  {id:"storyboard",no:"V-01",name:"絵コンテ",cnt:"scenes"},
  {id:"scenario",no:"V-02",name:"シナリオ",cnt:"scenes"},
  {id:"viewer",no:"V-03",name:"ビューワーとコメント"},
  {id:"materials",no:"V-04",name:"素材集め",cnt:"mat"},
  {id:"editor",no:"V-05",name:"編集（ムービーメーカー）"}
];
const STATUS=["未着手","案","確定"];
const READ_CPS=5; // 日本語ナレーションの読み上げ目安：1秒あたり約5文字（1分300字）

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toSec=v=>{const m=String(v||"").trim().match(/^(\d+):(\d{1,2})(?:\.(\d))?$/); return m?(+m[1]*60+ +m[2]+(m[3]?+m[3]/10:0)):null;};
const fmt=s=>{s=Math.max(0,s||0); const m=Math.floor(s/60), r=s-m*60; return m+":"+(r<10?"0":"")+r.toFixed(1);};
const fmt0=s=>{s=Math.max(0,Math.round(s||0)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
const segColor=i=>`var(--s${Math.min(6,i+1)})`;
const jaLen=t=>String(t||"").replace(/\s/g,"").length;

const st={db:null,user:null,assets:null,ready:false,err:"",readOnly:false,scenes:[],cuts:[],materials:[],mf:{group:"すべて",apply:"すべて",check:"すべて"},style:null,me:null,cm:null,ca:null,caState:"",threads:[],cmode:false,
  editing:{}, cutId:null, localUrl:"", localName:"", cur:0, names:{}};

// ---------- 接続 ----------
function setErr(m){st.err=m; const el=$("#liveStatus"); if(el){el.className="status"+(m?" err":""); el.textContent=m||statusText();}}
function statusText(){ if(!st.db) return "共有データにつないでいます…"; if(!st.ready) return "読み込み中…"; return st.readOnly?"閲覧のみです。書き込みには編集権限が必要です。":""; }
async function write(fn,okMsg){
  if(!st.db||st.readOnly) return false;
  try{ await fn(); setErr(""); if(okMsg) flash(okMsg); return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"||c==="not_granted"){st.readOnly=true; setErr("この表示では書き込めません。閲覧のみになります。");}
    else if(c==="quota_exceeded"||c==="resource_exhausted"){setErr("保存できる量の上限です。不要なコメントを削除してください。");}
    else setErr("保存できませんでした。通信を確認して、もう一度お試しください。");
    render(); return false;
  }
}
function flash(m){const el=$("#liveStatus"); if(!el) return; el.className="status"; el.textContent=m; clearTimeout(flash.t); flash.t=setTimeout(()=>{ if(el.textContent===m) el.textContent=statusText(); },2500);}

function start(){
  if(!window.claude||!window.claude.use){ setErr("この表示では共有データを使えません。"); return; }
  window.claude.use("user").then(async u=>{ st.user=u; if(u){ try{st.me=await u.id();}catch(_){} } render(); });
  window.claude.use("assets").then(a=>{ st.assets=a; render(); });
  window.claude.use("comments").then(c=>{ st.cm=c; syncAnchoring(); render(); });
  window.claude.use("db").then(db=>{
    if(!db){ setErr("共有データを使えません（サインインが必要です）。"); render(); return; }
    st.db=db; render();
    const timer=setTimeout(()=>{ if(!st.ready) setErr("共有データにまだ届きません。通信を確認してください。"); },10000);
    let n=0; const got=()=>{ if(++n>=3){ clearTimeout(timer); st.ready=true; if(st.err.startsWith("共有データにまだ")) st.err=""; } };
    const sub=(name,order,key)=>{ let first=true;
      db.collection(name).orderBy(order,"asc").onSnapshot(s=>{
        st[key]=s.docs.map(d=>({id:d.id,...d.data()}));
        if(first&&!s.metadata.fromCache){first=false; got();}
        if(key==="cuts"&&!st.cutId&&st.cuts.length) st.cutId=st.cuts[st.cuts.length-1].id;
        render();
      },e=>{ clearTimeout(timer); setErr("読み込めませんでした（"+e.code+"）"); render(); });
    };
    db.doc("meta/style").onSnapshot(d=>{ st.style=d.exists?d.data():null; render(); },()=>{});
    sub("scenes","order","scenes"); sub("cuts","createdAt","cuts"); sub("materials","order","materials");
    db.collection("edits").onSnapshot(s=>edOnList(s.docs.map(d=>Object.assign({id:d.id},d.data()))),()=>{});
  }).catch(()=>{ setErr("共有データを使えません。"); render(); });
}

function tcStrip(opts={}){
  const segs=st.scenes.map((s,i)=>{const a=toSec(s.tcIn),b=toSec(s.tcOut); if(a==null||b==null) return "";

    return `<a class="seg"${href} style="left:${a/TOTAL*100}%;width:${(b-a)/TOTAL*100}%;background:${segColor(i)}" title="${esc(s.tcIn)}–${esc(s.tcOut)} ${esc(s.era||"")}">${esc(s.era||s.title||"")}</a>`;}).join("");
  const ticks=[0,30,60,90,120,150,180].map(t=>`<span style="left:${t/TOTAL*100}%">${fmt0(t)}</span>`).join("");

const APPLY=["不要","必要","要確認","—"];

const APPLY_CLS={"不要":"ok","必要":"ng","要確認":"warn"};
const CHECK_CLS={"確認済み":"ok","確認中":"warn","未着手":""};
const RIGHT_CLS=r=>/パブリック|PD|CC0|CC BY|自社|自作/.test(r||"")?"ok":/要確認|不明/.test(r||"")?"warn":/不可|使わない/.test(r||"")?"ng":"";

  return (f.group==="すべて"||m.group===f.group)&&(f.apply==="すべて"||(m.apply||"要確認")===f.apply)&&(f.check==="すべて"||(m.check||"未着手")===f.check); }

    </div>

      `</tr>`).join("")+`</table></div>`;
  return h;

// ---------- コメント（claude.ai のコメント機能。印の位置だけこのページが決める） ----------
function tlPoint(t){
  const bar=$("#tl"); if(!bar) return null; const r=bar.getBoundingClientRect(); if(!r.width) return null;
  return {x:r.left+window.scrollX+Math.min(1,Math.max(0,t/TOTAL))*r.width, y:r.top+window.scrollY+r.height/2};
}
function reportPlaced(){
  if(!st.ca) return; const map={}; const key=curKey();
  st.threads.forEach(x=>{ const p=parseAnchor(x.anchor); if(p&&p.key===key){ const pt=tlPoint(p.t); if(pt) map[x.id]=pt; } });
  try{ st.ca.placed(map); }catch(_){}
}
async function syncAnchoring(){
  const want=curPage==="viewer"&&!!st.cm;
  if(want&&!st.ca&&st.caState!=="off"&&st.caState!=="pending"){
    st.caState="pending";
    try{
      st.ca=await st.cm.customAnchors({
        mode:on=>{ st.cmode=on; if(!on) st.threads=[]; refreshNote(); },
        threads:list=>{ st.threads=list||[]; reportPlaced(); refreshNote(); },
        reveal:id=>{ const x=st.threads.find(y=>y.id===id); const p=x&&parseAnchor(x.anchor); if(!p) return;
          if(p.key!==curKey()){ if(p.key==="local"){ flash("このコメントは「この端末の動画」に付いています。同じ動画を開いてください。"); return; } st.cutId=p.key; if(st.localUrl){URL.revokeObjectURL(st.localUrl); st.localUrl="";} render.force=true; render(); }
          seek(p.t); const bar=$("#tl"); if(bar) bar.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); }
      });
      st.caState="on"; if(curPage!=="viewer"){ st.ca.release(); st.ca=null; st.caState=""; } else reportPlaced();
    }catch(e){ st.ca=null; st.caState="off"; }
    refreshNote();
  } else if(!want&&st.ca){ try{ st.ca.release(); }catch(_){} st.ca=null; st.caState=""; st.threads=[]; st.cmode=false; }
}
function refreshNote(){ if(curPage!=="viewer"||!$("#view .viewer")) return; updateViewerSide(); }
async function composeAt(t){
  const key=curKey(); if(!key) return;
  const sc=sceneAt(t); const lbl=`${curLabel()} ${fmt(t)}${sc?" "+sc.era:""}`;
  const v=$("#vid"); if(v) v.pause();
  if(st.ca){
    const pt=tlPoint(t)||$("#tl");
    try{ await st.ca.compose(anchorOf(key,t),pt,{label:lbl}); }catch(e){ if(e&&e.code==="rate_limited") flash("少し待ってからもう一度押してください。"); }
  } else if(st.cm){
    try{ await st.cm.openComposer({element:$("#tl")||$("#view")}); flash(`時刻 ${fmt(t)} を書き添えてください。`); }catch(_){ flash("この表示ではコメントを書けません。"); }
  }
}
function bindVideo(){
  const v=$("#vid"); if(!v) return;

    const t=fmt(st.cur); const a=$("#nowT"); if(a) a.textContent=t;

const SHOOT_ONLY="ローアングル・バーズアイ・POV は撮影のときの角度です。撮る素材に指示として書いてください（絵コンテの「撮り方」）。";
function edFrame(ctx,t){
  const d=edDoc(), cl=d.clips, st0=edStarts();
  ctx.fillStyle="#000"; ctx.fillRect(0,0,CW,CH);
  const AH=d.aspect==="scope"?Math.round(CW/2.39):CH, TOPY=(CH-AH)/2;
  let i=cl.findIndex((c,k)=>t>=st0[k]&&t<st0[k]+Math.max(0.1,+c.dur||0)); if(i<0) return;
  const draw=(k,alpha)=>{ const c=cl[k]; const u=Math.min(1,Math.max(0,(t-st0[k])/Math.max(0.1,+c.dur||0)));
    const ms=c.ms==null?0:+c.ms, me=c.me==null?1:+c.me; const um=(EASE[c.ease]||EASE.inout)(Math.min(1,Math.max(0,(u-ms)/Math.max(0.01,me-ms))));
    ctx.save(); ctx.globalAlpha=alpha; ctx.beginPath(); ctx.rect(0,TOPY,CW,AH); ctx.clip();
    if(c.kind==="text"){ ctx.fillStyle=c.bg==="white"?"#f4f4f2":c.bg==="blue"?"#1d3f6e":"#000"; ctx.fillRect(0,TOPY,CW,AH); }

      else if(c.kind==="video"){ const v=edVid(c.asset); if(v.readyState>=2){ src=v; sw=v.videoWidth; sh=v.videoHeight; } }
      if(src&&sw){ const z=lerp(+c.z0||1,+c.z1||1,um), px=lerp(+c.x0||0,+c.x1||0,um), py=lerp(+c.y0||0,+c.y1||0,um), rot=lerp(+c.rot0||0,+c.rot1||0,um)*Math.PI/180;
        const sc=Math.max(CW/sw,AH/sh)*z, w=sw*sc, h=sh*sc; const ox=(CW-w)/2-px*(w-CW)/2, oy=TOPY+(AH-h)/2-py*(h-AH)/2;
        if(rot){ ctx.translate(CW/2,TOPY+AH/2); ctx.rotate(rot); ctx.translate(-CW/2,-(TOPY+AH/2)); }
        ctx.drawImage(src,ox,oy,w,h); }
      else { ctx.fillStyle="#222"; ctx.fillRect(0,TOPY,CW,AH); ctx.fillStyle="#888"; ctx.font="24px sans-serif"; ctx.textAlign="center"; ctx.fillText("読み込み中…",CW/2,CH/2); } }
    ctx.restore();
    // 文字
    let ja=c.textJa||""; if(c.kind==="text"&&c.typing){ const n=Math.floor(Math.min(1,u*1.6)*[...ja].length); ja=[...ja].slice(0,n).join("")+(u<0.75&&Math.floor(t*3)%2?"|":""); }
    if(ja){ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=c.kind==="text"&&c.bg==="white"?"#111":"#f2f2f2"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.font=(c.kind==="text"?"300 44px ":"300 34px ")+"'Zen Kaku Gothic New','Hiragino Sans',sans-serif";
      if(c.kind!=="text"){ ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=16; }
      String(ja).split("\n").forEach((ln,k,arr)=>ctx.fillText(ln,CW/2,CH/2+(k-(arr.length-1)/2)*52)); ctx.restore(); }
    if(c.textEn){ ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle="#cfcfcf"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="300 18px 'IBM Plex Mono',monospace";
      ctx.fillText(c.textEn,CW/2,d.aspect==="scope"?TOPY+AH+(CH-AH)/4:CH-40); ctx.restore(); }
  };
  const c=cl[i]; const fadeIn=c.trans==="fade"&&i>0?Math.min(1,(t-st0[i])/0.4):1;
  if(fadeIn<1){ draw(i-1,1); draw(i,fadeIn); } else draw(i,1);
}

function edPlayhead(t){ const T=edTotal(); const a=$("#edTime"); if(a) a.textContent=fmt(t)+" / "+fmt(T);
  const r=$("#edScrub"); if(r&&document.activeElement!==r){ r.max=String(T); r.value=String(t); }

function edSyncMedia(t,play){
  const d=edDoc(), st0=edStarts();
  d.clips.forEach((c,k)=>{ if(c.kind!=="video") return; const v=edVid(c.asset); const inT=t>=st0[k]&&t<st0[k]+c.dur;
    const sp=+c.speed||1;
    if(inT){ const want=(+c.in||0)+(t-st0[k])*sp; if(v.playbackRate!==sp) v.playbackRate=sp; if(Math.abs(v.currentTime-want)>0.25*sp) try{v.currentTime=want;}catch(_){} if(play&&v.paused) v.play().catch(()=>{}); if(!play) v.pause(); } else if(!v.paused) v.pause(); });
  d.audio.forEach(a=>{ const el=edAud(a); el.volume=Math.max(0,Math.min(1,a.vol==null?0.8:+a.vol)); const at=t-(+a.start||0); const len=a.len?+a.len:(el.duration?el.duration-(+a.in||0):1e9);
    if(at>=0&&at<len){ const want=(+a.in||0)+at; if(Math.abs(el.currentTime-want)>0.25) try{el.currentTime=want;}catch(_){} if(play&&el.paused) el.play().catch(()=>{}); if(!play) el.pause(); }
    else if(!el.paused) el.pause(); });
}
function edPlay(fromT){ if(ED.playing) return; ED.playing=true; ED.t=fromT==null?ED.t:fromT; if(ED.t>=edTotal()) ED.t=0;
  ED.t0=performance.now()-ED.t*1000; const b=$("#edPlayBtn"); if(b) b.textContent="一時停止";
  const loop=()=>{ if(!ED.playing) return; ED.t=(performance.now()-ED.t0)/1000; const T=edTotal();
    if(ED.t>=T){ edStop(true); if(ED.rec&&ED.rec.state==="recording") ED.rec.stop(); return; }
    edSyncMedia(ED.t,true); edDraw(ED.t); ED.raf=requestAnimationFrame(loop); };
  ED.raf=requestAnimationFrame(loop); }
function edStop(keep){ ED.playing=false; cancelAnimationFrame(ED.raf); edSyncMedia(ED.t,false); if(!keep){} const b=$("#edPlayBtn"); if(b) b.textContent="再生"; edDraw(ED.t); }
// --- 書き出し（実時間で録画。webm）
async function edExport(){

    await ED.actx.resume();

  const chunks=[]; let rec; try{ rec=new MediaRecorder(new MediaStream(tracks),mime?{mimeType:mime,videoBitsPerSecond:4_000_000}:{}); }catch(e){ setErr("書き出しを始められませんでした。"); return; }
  ED.rec=rec; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{ const type=(rec.mimeType||"video/webm").split(";")[0]; ED.recBlob=new Blob(chunks,{type}); if(ED.recUrl) URL.revokeObjectURL(ED.recUrl); ED.recUrl=URL.createObjectURL(ED.recBlob); ED.rec=null; edOut(); };
  $("#edOut").innerHTML=`<div class="note">書き出し中です（${fmt0(edTotal())}かかります）。画面を切り替えずにお待ちください。</div>`;
  rec.start(500); edPlay(0);
}

// --- 多段タイムライン（映像／文字・字幕／ナレーション／BGM／効果音）。指・Apple Pencil・マウスで操作
const LBL=96;
const TRACKS=[["video","映像"],["text","文字・字幕"],["narr","ナレーション"],["bgm","BGM"],["sfx","効果音"]];
const AUD_TRACKS=["narr","bgm","sfx"];
function audTrack(a){ if(a.track) return a.track; const n=String(a.name||""); return /ナレーション|narr|声/i.test(n)?"narr":/BGM|音楽|曲/i.test(n)?"bgm":"sfx"; }
function audLen(a){ if(+a.len>0) return +a.len; const el=ED.auds[a.id]; if(el&&el.duration&&isFinite(el.duration)) return Math.max(0.1,el.duration-(+a.in||0));
  const el2=edAud(a); if(!el2._lm){ el2._lm=1; el2.addEventListener("loadedmetadata",()=>{ if(curPage==="editor"&&ED.mounted&&!ED.drag) edTimeline(); }); } return Math.max(1,edTotal()-(+a.start||0)); }
function edTimeline(){
  const d=edDoc(), box=$("#edTL"); if(!box) return; const st0=edStarts(), T=Math.max(edTotal(),...d.audio.map(a=>(+a.start||0)+audLen(a)),5);
  const cnt=$("#edCount"); if(cnt) cnt.textContent=`${d.clips.length}カット・音 ${d.audio.length}・${fmt0(edTotal())}`;
  const W=Math.ceil(T*PX)+60; const step=PX>=80?1:PX>=30?5:10; let ticks="";
  for(let s=0;s<=T+0.01;s+=step) ticks+=`<span style="left:${s*PX}px">${fmt0(s)}</span>`;
  const bar=(cls,attrs,left,width,inner,sel)=>`<div class="tlBar ${cls}${sel?" sel":""}" ${attrs} style="left:${left}px;width:${Math.max(6,width)}px">
    <span class="tlH l" data-h="l"></span>${inner}<span class="tlH r" data-h="r"></span></div>`;
  const lane={video:"",text:"",narr:"",bgm:"",sfx:""};
  d.clips.forEach((c,k)=>{ const w=c.dur*PX-2;
    lane.video+=bar("v"+(c.kind==="text"?" txt":""),`data-clip="${k}"`,st0[k]*PX,w,
      `${c.kind==="image"&&c.img?`<img src="/_blob/${esc(c.img)}" alt="" loading="lazy" draggable="false"${c.mono?' style="filter:grayscale(1)"':""}>`:""}<span class="tlT">${c.kind==="text"?"文字："+esc(c.textJa||""):c.kind==="video"?"動画："+esc(c.title||""):esc(c.title||"")}</span>`,k===ED.sel&&ED.selA<0);
    if(c.textJa||c.textEn) lane.text+=bar("t",`data-clip="${k}" data-nodrag="1"`,st0[k]*PX,w,`<span class="tlT">${esc((c.textJa||"").replace(/\n/g," "))}${c.textEn?" ／ "+esc(c.textEn):""}</span>`,k===ED.sel&&ED.selA<0); });
  // 同じ段で重なる音は、段の中で上下に振り分ける
  const slots={}, nSlot={narr:1,bgm:1,sfx:1};
  AUD_TRACKS.forEach(tr=>{ const ends=[]; d.audio.map((a,k)=>({a,k})).filter(o=>audTrack(o.a)===tr).sort((x,y)=>(+x.a.start||0)-(+y.a.start||0)).forEach(o=>{
    const s0=+o.a.start||0; let i=ends.findIndex(e=>e<=s0+0.001); if(i<0){ i=ends.length; ends.push(0); } ends[i]=s0+audLen(o.a); slots[o.k]=i; }); nSlot[tr]=Math.max(1,ends.length); });
  d.audio.forEach((a,k)=>{ const tr=audTrack(a); const n=nSlot[tr], sl=slots[k]||0; const hh=n>1?28:44;
    lane[tr]+=bar("a "+tr,`data-aud="${k}"`,(+a.start||0)*PX,audLen(a)*PX-2,`<span class="tlT">♪ ${esc(a.name||"音")}</span><span class="tlVol" style="height:${Math.round((a.vol==null?0.8:+a.vol)*100)}%"></span>`,k===ED.selA).replace('style="left:',`style="top:${6+sl*(hh+4)}px;bottom:auto;height:${hh}px;left:`); });
  ED._laneH=nSlot;
  const add=tr=>st.assets?`<label class="tlAdd" title="音のファイルを足す">＋<input type="file" data-audtrack="${tr}" accept=".m4a,audio/mp4,audio/x-m4a,video/mp4,video/webm,audio/webm" hidden></label>`:"";
  box.innerHTML=`<div class="tlInner" style="width:${W+LBL}px">
    <div class="tlRow tlRulerRow"><div class="tlLbl"><span class="note">時間</span></div><div class="tlLane tlRuler" data-ruler="1" style="width:${W}px">${ticks}</div></div>
    ${TRACKS.map(([k,n])=>`<div class="tlRow" data-track="${k}"><div class="tlLbl">${n}${AUD_TRACKS.includes(k)?add(k):""}</div><div class="tlLane" style="width:${W}px${AUD_TRACKS.includes(k)&&nSlot[k]>1?`;height:${12+nSlot[k]*32}px`:""}">${lane[k]||(AUD_TRACKS.includes(k)?`<span class="tlEmpty">${st.assets?"左の＋から音を足す":"音はまだありません"}</span>`:"")}</div></div>`).join("")}
    <div class="tlPH" id="edPH" style="left:${LBL+ED.t*PX}px"></div></div>`;
}

let PXmin=8,PXmax=240;
function tlZoom(f){ const box=$("#edTL"); const center=box?(box.scrollLeft+box.clientWidth/2-LBL)/PX:ED.t; PX=Math.max(PXmin,Math.min(PXmax,PX*f)); edTimeline(); if(box) box.scrollLeft=center*PX+LBL-box.clientWidth/2; const z=$("#edZoomV"); if(z) z.textContent=Math.round(PX)+"px/秒"; }
document.addEventListener("pointerdown",e=>{
  if(curPage!=="editor") return; const box=$("#edTL"); if(!box||!box.contains(e.target)) return;
  const ruler=e.target.closest("[data-ruler]"); if(ruler){ const r=ruler.getBoundingClientRect(); ED.t=Math.max(0,(e.clientX-r.left)/PX); if(ED.playing) edStop(); edSyncMedia(ED.t,false); edDraw(ED.t); ED.drag={kind:"seek",lane:r}; ruler.setPointerCapture(e.pointerId); e.preventDefault(); return; }

  const h=e.target.dataset.h||"m"; const isA=el.dataset.aud!=null; const idx=+(isA?el.dataset.aud:el.dataset.clip);
  const d=edDoc(); const o=isA?JSON.parse(JSON.stringify(d.audio[idx])):JSON.parse(JSON.stringify(d.clips[idx]));

document.addEventListener("pointermove",e=>{
  const g=ED.drag; if(!g) return;
  if(g.kind==="seek"){ ED.t=Math.max(0,(e.clientX-g.lane.left)/PX); edSyncMedia(ED.t,false); edDraw(ED.t); return; }
  const dx=e.clientX-g.x0; if(!g.moved&&Math.abs(dx)<5) return; g.moved=true; if(g.nodrag) return;
  const ds=dx/PX, d=edDoc(), snap=v=>Math.round(v*20)/20;
  if(g.kind==="aud"){ const a=d.audio[g.idx]; const L0=audLen(g.o);
    if(g.h==="m"){ a.start=Math.max(0,snap((+g.o.start||0)+ds)); g.el.style.left=(a.start*PX)+"px"; }
    else if(g.h==="r"){ a.len=Math.max(0.2,snap(L0+ds)); g.el.style.width=(a.len*PX-2)+"px"; }
    else { const dd=Math.max(-(+g.o.in||0),Math.min(L0-0.2,ds)); a.start=snap((+g.o.start||0)+dd); a.in=snap((+g.o.in||0)+dd); a.len=snap(L0-dd); g.el.style.left=(a.start*PX)+"px"; g.el.style.width=(a.len*PX-2)+"px"; }
  } else { const c=d.clips[g.idx]; const sp=+c.speed||1;
    if(g.h==="r"){ c.dur=Math.max(0.1,snap(g.o.dur+ds)); g.el.style.width=(c.dur*PX-2)+"px"; }
    else if(g.h==="l"&&c.kind==="video"){ const dd=Math.max(-(+g.o.in||0)/sp,Math.min(g.o.dur-0.1,ds)); c.in=snap((+g.o.in||0)+dd*sp); c.dur=snap(g.o.dur-dd); g.el.style.width=(c.dur*PX-2)+"px"; }
    else if(g.h==="m"){ // 横に動かして並べ替え：中心が隣のカットを越えたら入れ替え
      g.el.style.transform=`translateX(${dx}px)`; g.el.style.zIndex=5; }
  }
});
document.addEventListener("pointerup",e=>{
  const g=ED.drag; if(!g) return; ED.drag=null;
  if(g.kind==="seek") return;
  if(!g.moved){ // タップ＝選択

(function registerWebMCP(){ // Chrome の WebMCP（navigator.modelContext）があれば登録する
  try{ const mc=navigator.modelContext; if(!mc) return;
    const tools=MM_TOOLS.map(([name,description,props])=>({name:"movieMaker_"+name,description,inputSchema:{type:"object",properties:props},
      execute:async(args)=>{ try{ const r=await MM[name](args||{}); return {content:[{type:"text",text:JSON.stringify(r)}]}; }catch(e){ return {content:[{type:"text",text:"エラー："+e.message}],isError:true}; } }}));
    if(typeof mc.provideContext==="function") mc.provideContext({tools}); else if(typeof mc.registerTool==="function") tools.forEach(t=>mc.registerTool(t));

  for(const c of cmds){ const f=MM[c.tool]; if(!f){ out.push({tool:c.tool,error:"その操作はありません"}); continue; }
    try{ out.push({tool:c.tool,result:await f(c.args||{})}); }catch(e){ out.push({tool:c.tool,error:e.message}); } }
  return JSON.stringify(out,null,1); }

  const ae=document.activeElement;
  if(ae&&$("#view").contains(ae)&&(ae.tagName==="TEXTAREA"||(ae.tagName==="INPUT"&&ae.type!=="file"))){ deferred=true; const s=$("#liveStatus"); if(s&&!st.err) s.textContent=statusText(); return; }
  if(p.id==="editor"&&ED.mounted&&!render.force){ edRefresh(); return; }
  if(p.id!=="editor"&&ED.mounted){ if(ED.playing) edStop(); ED.mounted=false; }
  if(p.id==="viewer"&&$("#vid")&&!render.force){ // 再生中の動画を止めないよう、動画以外だけ更新
    const v=$("#vid"); const cut=curCut(); const want=st.localUrl||(cut&&cut.asset?"/_blob/"+cut.asset:"");
    if(v.getAttribute("src")===want){ updateViewerSide(); return; }
  }
  render.force=false;
  let body="";
  if(p.id==="top") body=pageTop(); else if(p.id==="storyboard") body=pageStoryboard(); else if(p.id==="scenario") body=pageScenario(); else if(p.id==="materials") body=pageMaterials(); else if(p.id==="editor") body=pageEditor(); else body=pageViewer();
  $("#view").innerHTML=head(p, p.id==="top"?"準備中":"")+body;
  setErr(st.err);
  if(p.id==="viewer"){ bindVideo(); }
  if(p.id==="editor"){ edMount(); } else ED.mounted=false;
  syncAnchoring(); if(p.id==="viewer") requestAnimationFrame(reportPlaced);
}
let deferred=false;
function updateViewerSide(){
  const tmp=document.createElement("div"); tmp.innerHTML=pageViewer();
  const right=$("#view .viewer > div:last-child"), nr=tmp.querySelector(".viewer > div:last-child");
  if(right&&nr) right.replaceWith(nr);
  const tc=$("#view .viewer .tc"), ntc=tmp.querySelector(".viewer .tc"); if(tc&&ntc) tc.replaceWith(ntc);
  ["#cmNote","#commentHere"].forEach(sel=>{ const a=$(sel), b=tmp.querySelector(sel); if(a&&b) a.replaceWith(b); });
  setErr(st.err); reportPlaced();
}
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(deferred){ const ae=document.activeElement; if(!(ae&&$("#view").contains(ae)&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT"))){ deferred=false; render(); } } },0); });

function route(){ const h=(location.hash||"").slice(1); curPage=PAGES.some(p=>p.id===h)?h:"top"; render.force=true; deferred=false; render(); window.scrollTo(0,0); $("#side").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
window.addEventListener("hashchange",route);
$("#menuBtn").addEventListener("click",()=>{const o=$("#side").classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded",String(o));});

// ---------- 操作 ----------
window.addEventListener("resize",()=>{ if(curPage==="viewer") reportPlaced(); });
document.addEventListener("click",e=>{ // コメントモード中はタイムラインを押した時刻にコメント。通常時はその時刻へ移動
  const bar=e.target.closest&&e.target.closest("#tl"); if(!bar) return;
  e.preventDefault(); e.stopPropagation();
  const r=bar.getBoundingClientRect(); const t=Math.max(0,Math.min(TOTAL,(e.clientX-r.left)/r.width*TOTAL));
  if(st.cmode&&st.ca&&curKey()) composeAt(t); else seek(t);
},true);
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  if(t.dataset.seek!=null){ seek(t.dataset.seek); return; }
  if(t.dataset.scene&&t.tagName==="A"){ e.preventDefault(); st.sbSel=t.dataset.scene; if(curPage!=="storyboard") location.hash="storyboard"; else { render.force=true; render(); } return; }
  if(t.dataset.sb){ st.sbSel=t.dataset.sb; render.force=true; render(); if(matchMedia("(max-width:900px)").matches){ const el=$(".sbDetail"); if(el) el.scrollIntoView({block:"start"}); } return; }
  if(t.dataset.mf){ const k=t.dataset.mf, v=t.dataset.v; st.mf[k]=st.mf[k]===v?"すべて":v; render.force=true; render(); return; }
  if(t.dataset.mfclear){ st.mf={group:"すべて",apply:"すべて",check:"すべて"}; render.force=true; render(); return; }
  if(t.id==="commentHere"){ composeAt(st.cur); return; }
  if(t.dataset.cut){ st.cutId=t.dataset.cut; if(st.localUrl){ URL.revokeObjectURL(st.localUrl); st.localUrl=""; } st.cur=0; render.force=true; render(); return; }
  const act=t.dataset.act; if(!act) return;
  if(act==="edit"){ st.editing[t.dataset.key]=true; render.force=true; deferred=false; document.activeElement&&document.activeElement.blur(); render(); return; }
  if(act==="cancel"){ delete st.editing[t.dataset.key]; deferred=false; document.activeElement&&document.activeElement.blur(); render.force=true; render(); return; }
});
document.addEventListener("submit",async e=>{
  const f=e.target; e.preventDefault();
  if(f.dataset.form==="board"||f.dataset.form==="script"){
    const id=f.dataset.id; const fd=new FormData(f); const patch={};
    for(const [k,v] of fd.entries()){ if(typeof v==="string") patch[k]=v.trim(); }
    if("tcIn" in patch&&patch.tcIn&&toSec(patch.tcIn)==null){ setErr("開始は 0:20 のように「分:秒」で入れてください。"); return; }
    if("tcOut" in patch&&patch.tcOut&&toSec(patch.tcOut)==null){ setErr("終了は 0:35 のように「分:秒」で入れてください。"); return; }
    patch.updatedAt=new Date().toISOString(); if(st.me) patch.updatedBy=st.me;
    const ok=await write(()=>st.db.collection("scenes").doc(id).update(patch),"保存しました");
    if(ok){ delete st.editing[(f.dataset.form==="board"?"b:":"s:")+id]; deferred=false; document.activeElement&&document.activeElement.blur(); render.force=true; render(); flash("保存しました"); }
    return;
  }
  if(f.id==="cutForm"){
    const file=$("#cutFile").files[0]; const label=$("#cutLabel").value.trim(); if(!file||!label) return;
    if(file.size>20*1024*1024){ setErr("20MB を超えています。720p で書き出し直すか、「この端末の動画で見る」を使ってください。"); return; }
    const btn=f.querySelector("button[type=submit]"); btn.disabled=true; btn.textContent="上げています…";
    try{
      const r=await st.assets.upload(file,{type:file.type==="video/webm"?"video/webm":"video/mp4"});
      const ok=await write(()=>st.db.collection("cuts").add({label,memo:$("#cutMemo").value.trim(),asset:r.id,createdAt:new Date().toISOString(),by:st.me||""}));
      if(ok){ $("#cutLabel").value=""; $("#cutMemo").value=""; $("#cutFile").value=""; st.cutId=null; flash("版を追加しました"); }
    }catch(err){ const c=err&&err.code;
      setErr(c==="too_large"?"20MB を超えています。720p で書き出し直してください。":c==="unsupported_type"?"MP4 か WebM の動画を選んでください。":c==="quota_or_state"?"保存容量の上限です。古い版を整理してください。":"動画を上げられませんでした。もう一度お試しください。"); }
    btn.disabled=false; btn.textContent="上げる";
    render.force=true; deferred=false; document.activeElement&&document.activeElement.blur(); render();
  }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="mfGroup"||t.id==="mfApply"||t.id==="mfCheck"){ st.mf[{mfGroup:"group",mfApply:"apply",mfCheck:"check"}[t.id]]=t.value; t.blur(); render.force=true; render(); return; }
  if(t.dataset.mfield){ const id=t.dataset.mid, k=t.dataset.mfield, v=t.value; t.blur(); await write(()=>st.db.collection("materials").doc(id).update({[k]:v}),"更新しました"); return; }
  if(t.dataset.mimg&&t.files[0]&&st.assets){ const id=t.dataset.mimg, f=t.files[0];
    try{ const r=await st.assets.upload(f,{type:/^image\/(png|jpeg|webp)$/.test(f.type)?f.type:"image/jpeg"}); await write(()=>st.db.collection("materials").doc(id).update({img:r.id}),"画像を貼りました"); }
    catch(err){ setErr(err&&err.code==="too_large"?"画像が大きすぎます（20MB まで）。":"画像を上げられませんでした。PNG か JPEG を選んでください。"); }
    return; }
  if(t.id==="localFile"&&t.files[0]){ if(st.localUrl) URL.revokeObjectURL(st.localUrl); st.localUrl=URL.createObjectURL(t.files[0]); st.localName=t.files[0].name; st.cur=0; render.force=true; deferred=false; t.blur(); render(); return; }
  if(t.dataset.frame&&t.files[0]&&st.assets){
    const id=t.dataset.frame; const file=t.files[0];
    try{ const r=await st.assets.upload(file,{type:/^image\/(png|jpeg|webp)$/.test(file.type)?file.type:"image/png"});
      await write(()=>st.db.collection("scenes").doc(id).update({frame:r.id}),"コマ画像を貼りました"); }
    catch(err){ setErr(err&&err.code==="too_large"?"画像が大きすぎます（20MB まで）。":"画像を上げられませんでした。PNG か JPEG を選んでください。"); }
  }
});

route();
start();
})();
</script>
